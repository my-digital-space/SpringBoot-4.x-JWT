spring:
  application:
    name: JWT_Auth

  # ----------------------------------------------------------
  # DataSource — MySQL 8 connection settings
  # ----------------------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/jwt_auth_db # JDBC connection URL
    username: ${DB_USERNAME:root} # Database username; resolved from env var DB_USERNAME with fallback to 'root'
    password: ${DB_PASSWORD:root} # Database password; resolved from env var DB_PASSWORD with fallback to 'root'
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL Connector/J 8 JDBC driver class

    hikari: # HikariCP connection pool settings (default pool in Spring Boot)
      pool-name: JwtAuthHikariPool # Human-readable pool name shown in metrics and logs
      maximum-pool-size: 10 # Maximum number of connections in the pool
      minimum-idle: 5 # Minimum number of idle connections maintained at all times
      idle-timeout: 300000 # Milliseconds a connection can sit idle before being released (5 minutes)
      connection-timeout: 20000 # Milliseconds to wait for a connection from the pool before throwing (20 seconds)
      max-lifetime: 1800000 # Maximum connection lifetime in the pool in milliseconds (30 minutes)

  # ----------------------------------------------------------
  # JPA / Hibernate — ORM and schema settings
  # ----------------------------------------------------------
  jpa:
    hibernate: # Hibernate-specific settings
      ddl-auto: update # Auto-update schema on startup; use 'validate' or 'none' in production
    show-sql: false # Do not print SQL statements to stdout; enable only for debugging
    open-in-view: false # Disable OSIV to avoid lazy-loading pitfalls and connection leaks
    properties: # Additional Hibernate properties passed directly to the EntityManagerFactory
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect # MySQL-compatible SQL dialect for query generation
        format_sql: true # Pretty-print SQL when show-sql is enabled
        jdbc: # JDBC-level Hibernate tuning
          batch_size: 25 # Number of statements batched together per round trip
        order_inserts: true # Reorder INSERT statements to maximize JDBC batch efficiency
        order_updates: true # Reorder UPDATE statements to maximize JDBC batch efficiency

  # ----------------------------------------------------------
  # Jackson — JSON serialisation settings
  # ----------------------------------------------------------
  jackson: # Jackson ObjectMapper configuration
    default-property-inclusion: non_null # Omit null fields from all JSON responses
    serialization: # Serialisation feature flags
      write-dates-as-timestamps: false # Serialise dates as ISO-8601 strings, not epoch numbers

# ============================================================
# Server configuration
# ============================================================
server: # Embedded Tomcat / server settings
  port: ${SERVER_PORT:8081} # HTTP port; resolved from env var SERVER_PORT with fallback to 8081
  servlet: # Servlet-container settings
    context-path: / # Root context path for all endpoints
  error: # Spring Boot error-response settings
    include-message: never # Never expose raw exception messages in error responses (security)
    include-stacktrace: never # Never expose stack traces in error responses (security)
    include-binding-errors: never # Never expose binding/validation error details in error responses

# ============================================================
# Application-level custom properties
# ============================================================
application: # Custom namespace for app-specific configuration

  security: # Security-related custom properties
    jwt: # JWT token configuration block
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # 256-bit hex-encoded HMAC-SHA256 signing key; MUST be overridden via env var in production
      access-token-expiration: 600000 # Access token validity in milliseconds — 10 minutes
      refresh-token-expiration: 604800000 # Refresh token validity in milliseconds — 7 days (7 * 24 * 60 * 60 * 1000)
      refresh-token-cookie-name: refresh_token # Name of the HttpOnly cookie that carries the refresh token
      issuer: jwt-auth-app # JWT 'iss' (issuer) claim value embedded in every token

# ============================================================
# Logging configuration
# ============================================================
logging: # Spring Boot logging settings
  level: # Per-package log-level overrides
    root: INFO # Default log level for all packages
    com.my.jwt: DEBUG # Verbose logging for this application's own packages during development
    org.springframework.security: INFO # Spring Security logs; raise to DEBUG to trace filter chain
    org.hibernate.SQL: WARN # Suppress SQL logs unless debugging; overridden by jpa.show-sql
  pattern: # Log output format patterns
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n" # Human-readable console pattern with timestamp, thread, level, logger, and message

